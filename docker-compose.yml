services:
  web:
    build: .
    ports:
      - "8080:8000"
    volumes:
      - ./data:/app/data
      - /var/log/nginx:/var/log/nginx:ro
    depends_on:
      - ollama
    environment:
      - OLLAMA_API_URL=http://ollama:11434/api/generate
    restart: always

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: always

volumes:
  ollama_data:
