<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <title>{{ t('login.title') }}</title>
    <link rel="stylesheet" href="/static/style.css">

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const theme = document.documentElement.getAttribute('data-theme');
            document.querySelectorAll('.theme-icon').forEach(icon => {
                icon.className = theme === 'light' ? 'fa-solid fa-moon theme-icon' : 'fa-solid fa-sun theme-icon';
            });
        }
        document.addEventListener('DOMContentLoaded', updateThemeIcon);
    </script>
        <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<div style="position: fixed; top: 20px; right: 20px; z-index: 999; display: flex; gap: 10px; align-items: center;">
        <select onchange="window.location.href='/set_lang/'+this.value" class="lang-select">
            <option value="ru" {% if current_lang == 'ru' %}selected{% endif %}>🇷🇺 RU</option>
            <option value="en" {% if current_lang == 'en' %}selected{% endif %}>🇬🇧 EN</option>
            <option value="zh" {% if current_lang == 'zh' %}selected{% endif %}>🇨🇳 中文</option>
        </select>
        <button id="theme-btn" onclick="toggleTheme()" style="background: transparent; border: none; color: var(--text-main); font-size: 18px; cursor: pointer;"><i class="fa-solid fa-sun theme-icon"></i></button>
    </div>
    <div class="auth-wrapper">
        <div class="auth-box">
            <h2><i class="fa-solid fa-shield-halved"></i> {{ t('login.heading') }}</h2>
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div class="error-msg" style="background: rgba(16, 185, 129, 0.2); color: var(--success); border-color: var(--success);">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}
            {% if error %}<div class="error-msg">{{ error|safe }}</div>{% endif %}
            <form method="POST">
                <input type="text" name="username" placeholder="{{ t('login.username') }}" required>
                <input type="password" name="password" placeholder="{{ t('login.password') }}" required>
                <button type="submit" class="btn" style="width: 100%; justify-content: center;">{{ t('login.submit') }}</button>
            </form>
            <a href="/register" class="auth-link">{{ t('login.no_account') }}</a>
        </div>
    </div>
</body>
</html>
