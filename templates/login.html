<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход - AI-SecScan</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-box">
            <h2><i class="fa-solid fa-shield-halved"></i> Вход</h2>
            {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
            <form method="POST">
                <input type="text" name="username" placeholder="Логин" required>
                <input type="password" name="password" placeholder="Пароль" required>
                <button type="submit" class="btn" style="width: 100%; justify-content: center;">Войти</button>
            </form>
            <a href="/register" class="auth-link">Нет аккаунта? Зарегистрироваться</a>
        </div>
    </div>
</body>
</html>
