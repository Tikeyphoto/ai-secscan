<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-SecScan - Анализ безопасности</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fa-solid fa-shield-halved"></i> AI-SecScan</div>
        <div class="user-nav">
            <span><i class="fa-regular fa-user"></i> {{ user['username'] }}</span>
            <a href="/profile" style="color: var(--text-main); text-decoration: none; margin-left: 15px; font-size: 14px;"><i class="fa-solid fa-id-card"></i> Профиль</a>
            <a href="/logout" class="btn-logout">Выйти</a>
        </div>
    </nav>

    <div class="container">
        <div class="card" style="margin-top: 20px;">
            <label class="ai-switch" for="useAi">
                <input type="checkbox" id="useAi">
                <label for="useAi"><i class="fa-solid fa-robot"></i> Включить глубокий AI-анализ (LLM) для поиска логических ошибок</label>
            </label>

            <div class="drop-zone" id="dropZone">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <p style="font-size: 18px; font-weight: 600;">Перетащите файл сюда или нажмите для выбора</p>
                <p>Поддерживаются: ZIP-архивы, .py, .js, .php, .java, .env, .yml, .json</p>
                <div class="file-name" id="fileName"></div>
                <input type="file" id="fileInput" style="display: none;" accept=".zip,.py,.js,.php,.java,.ts,.env,.yml,.yaml,.json,.txt,.cfg,.ini,.xml">
            </div>
            
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn" id="scanFileBtn" onclick="scanFile()" disabled style="font-size: 16px; padding: 12px 30px;">
                    <i class="fa-solid fa-magnifying-glass"></i> Сканировать файл
                </button>
            </div>
        </div>

        <div class="card">
            <p style="margin-top: 0; color: var(--text-muted); font-size: 14px;">Или вставьте код вручную:</p>
            <textarea id="codeInput" placeholder="def my_function():\n    pass"></textarea>
            <div style="text-align: right; margin-top: 10px;">
                <button class="btn" onclick="scanCode()"><i class="fa-solid fa-code"></i> Сканировать текст</button>
            </div>
        </div>

        <div id="loader" class="spinner"></div>
        <div id="results"></div>
    </div>

    <script>
        // Drag & Drop логика
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const scanFileBtn = document.getElementById('scanFileBtn');

        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                updateFileName();
            }
        });

        fileInput.addEventListener('change', updateFileName);

        function updateFileName() {
            if (fileInput.files.length > 0) {
                fileName.innerHTML = `<i class="fa-solid fa-file-code"></i> Выбран файл: ${fileInput.files[0].name}`;
                scanFileBtn.disabled = false;
            } else {
                fileName.innerHTML = '';
                scanFileBtn.disabled = true;
            }
        }

        // Логика сканирования
        function showLoading() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('results').innerHTML = '';
        }

        function hideLoading() { document.getElementById('loader').style.display = 'none'; }

        function handleError(status, data) {
            hideLoading();
            const resultsDiv = document.getElementById('results');
            let errorMsg = data.error || `HTTP ${status}`;
            let actionHtml = status === 403 ? `<br><br><a href="/profile" style="color: white;">Перейти в профиль, чтобы сменить тариф →</a>` : '';
            resultsDiv.innerHTML = `<div class="error-msg" style="font-size: 16px; padding: 20px;">⚠️ ${errorMsg} ${actionHtml}</div>`;
        }

        async function scanFile() {
            if (!fileInput.files.length) return;
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('use_ai', document.getElementById('useAi').checked);
            
            showLoading();
            try {
                const response = await fetch('/api/scan', { method: 'POST', body: formData });
                const data = await response.json();
                hideLoading();
                if (!response.ok) { handleError(response.status, data); return; }
                handleResponse(data);
            } catch (e) { hideLoading(); document.getElementById('results').innerHTML = `<div class="error-msg">Ошибка сети: ${e.message}</div>`; }
        }

        async function scanCode() {
            const code = document.getElementById('codeInput').value;
            if (!code.trim()) return alert("Введите код!");
            
            showLoading();
            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, use_ai: document.getElementById('useAi').checked })
                });
                const data = await response.json();
                hideLoading();
                if (!response.ok) { handleError(response.status, data); return; }
                handleResponse(data);
            } catch (e) { hideLoading(); document.getElementById('results').innerHTML = `<div class="error-msg">Ошибка сети: ${e.message}</div>`; }
        }

        function handleResponse(data, isHistorical = false) {
            const resultsDiv = document.getElementById('results');
            
            const errors = data.findings.filter(f => f.error);
            const validFindings = data.findings.filter(f => !f.error && f.weight > 0.0);

            let html = '';
            if (!isHistorical && data.scans_left !== undefined) {
                html += `<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h2 style="margin:0;">Результаты</h2>
                            <span class="badge" style="background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-main);">Осталось сканирований: ${data.scans_left}</span>
                         </div>`;
            } else if (isHistorical) {
                html += `<div style="margin-bottom: 20px; color: var(--text-muted);"><i class="fa-solid fa-clock-rotate-left"></i> Загружены результаты последнего сканирования</div>`;
            }
            
            errors.forEach(e => { html += `<div class="error-msg">🚫 ${e.error}</div>`; });

            html += `<div style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <a href="/api/report/pdf" class="btn" style="background: #e11d48;"><i class="fa-solid fa-file-pdf"></i> PDF</a>
                        <a href="/api/report/json" class="btn" style="background: var(--success);"><i class="fa-brands fa-js"></i> JSON</a>
                        <a href="/api/report/sarif" class="btn" style="background: #3b82f6;"><i class="fa-solid fa-shield"></i> SARIF</a>
                     </div>`;

            if (validFindings.length === 0) {
                resultsDiv.innerHTML = html + '<div class="card" style="text-align: center; color: var(--success); font-size: 20px; padding: 40px;"><i class="fa-solid fa-check-circle"></i> Уязвимостей не найдено!</div>';
                return;
            }
            
                        // Вывод Security Score (только если есть уязвимости)
            if (validFindings.length > 0 && data.score !== undefined) {
                html += `
                <div class="score-container">
                    <div class="score-circle score-${data.grade}">${data.grade}</div>
                    <div>
                        <h3 style="margin: 0; color: var(--text-main);">Оценка безопасности: ${data.score}/100</h3>
                        <p style="margin: 5px 0 0 0; color: var(--text-muted); font-size: 14px;">${
                            data.grade === 'A' ? 'Отличный уровень защиты!' : 
                            data.grade === 'F' ? 'Критический уровень риска. Требуется немедленное вмешательство.' : 
                            'Есть проблемы, которые следует исправить.'
                        }</p>
                    </div>
                </div>`;
            }html += `<h3 style="margin-bottom: 20px;">Найдено проблем: <span style="color: var(--danger)">${validFindings.length}</span></h3>`;
            validFindings.forEach((f, index) => {
                const isAi = f.rule_id === 'AI_LOGIC_FLAW';
                const badgeClass = isAi ? 'AI_LOGIC_FLAW' : f.severity;
                const icon = isAi ? 'fa-robot' : 'fa-triangle-exclamation';
                
                html += `
                <div class="finding ${f.severity}" style="border-left-color: ${isAi ? 'var(--ai-color)' : (f.severity === 'CRITICAL' ? 'var(--danger)' : 'var(--warning)')}">
                    <div class="finding-header">
                        <div class="finding-title"><i class="fa-solid ${icon}" style="color: ${isAi ? 'var(--ai-color)' : 'inherit'}"></i> ${f.rule_id}</div>
                        <span class="badge ${badgeClass}">${f.severity}</span>
                    </div>
                    <p style="margin: 10px 0; color: var(--text-main);">${f.message}</p>
                    <div style="font-size: 13px; color: var(--text-muted);"><i class="fa-solid fa-file-code"></i> ${f.file || data.filename} : строка ${f.line}</div>
                    <div class="code-block">${f.code}</div>
                                        <div class="finding-actions" style="justify-content: space-between;">
                        <div>
                            <button class="btn-feedback btn-tp" onclick="sendFeedback('${f.rule_id}', true, ${index}, '${f.id}')"><i class="fa-solid fa-check"></i> Реальная</button>
                            <button class="btn-feedback btn-fp" onclick="sendFeedback('${f.rule_id}', false, ${index}, '${f.id}')"><i class="fa-solid fa-xmark"></i> Ложная</button>
                        </div>
                        <button class="btn-fix" onclick="generateFix(this, '${encodeURIComponent(f.code)}', '${encodeURIComponent(f.message)}')">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Исправить с AI
                        </button>
                    </div>
                    <div class="fix-container">
                        <div class="fix-header"><i class="fa-solid fa-robot"></i> AI Предлагает безопасный код:</div>
                        <div class="code-block-fixed"></div>
                    </div></div>`;
            });
            resultsDiv.innerHTML = html;
        }

                async function generateFix(btn, encodedCode, encodedIssue) {
            const findingDiv = btn.closest('.finding');
            const fixContainer = findingDiv.querySelector('.fix-container');
            const codeBlock = fixContainer.querySelector('.code-block-fixed');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Генерация...';
            btn.disabled = true;
            fixContainer.style.display = 'block';
            codeBlock.innerText = 'Нейросеть анализирует уязвимость и пишет безопасный код...';
            
            try {
                const response = await fetch('/api/fix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: decodeURIComponent(encodedCode), issue: decodeURIComponent(encodedIssue) })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    codeBlock.innerText = data.fixed_code;
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Готово';
                    btn.style.borderColor = 'var(--success)';
                    btn.style.color = 'var(--success)';
                } else {
                    codeBlock.innerText = 'Ошибка AI: ' + (data.error || 'Неизвестно');
                }
            } catch (e) {
                codeBlock.innerText = 'Ошибка сети: ' + e.message;
            }
        }

        async function sendFeedback(ruleId, isTp, index, findingHash) {
            try {
                const response = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rule_id: ruleId, is_tp: isTp, finding_hash: findingHash })
                });
                if (response.ok) {
                    const btnParent = event.target.closest('.finding-actions');
                    btnParent.innerHTML = isTp ? '<span style="color:var(--success)"><i class="fa-solid fa-check"></i> Отмечено как реальное</span>' : '<span style="color:var(--danger)"><i class="fa-solid fa-xmark"></i> Скрыто как ложное</span>';
                    if (!isTp) { btnParent.closest('.finding').style.opacity = '0.5'; }
                }
            } catch (e) { console.error(e); }
        }

        // Автозагрузка последнего скана
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/last_scan');
                const data = await response.json();
                if (data.status === 'success') handleResponse(data, true);
            } catch (e) {}
        });
    </script>
</body>
</html>
