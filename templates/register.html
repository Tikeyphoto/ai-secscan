<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация - AI-SecScan</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-box">
            <h2><i class="fa-solid fa-user-plus"></i> Регистрация</h2>
            {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
            <form method="POST">
                <input type="text" name="username" placeholder="Придумайте логин" required>
                <input type="password" name="password" placeholder="Придумайте пароль" required>
                <button type="submit" class="btn" style="width: 100%; justify-content: center;">Создать аккаунт</button>
            </form>
            <a href="/login" class="auth-link">Уже есть аккаунт? Войти</a>
        </div>
    </div>
</body>
</html>
